<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN подписки</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0b0e14, #020304);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    /* ---------- ПЕРВАЯ РАМКА ---------- */
    .profile-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .avatar-container {
      position: relative;
      width: 150px;
      height: 150px;
    }

    /* Квадратная ава — синий градиент, текст VPN белый */
    .avatar {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #1f5ed6, #0a3fa8);
      border-radius: 32px;
      overflow: hidden;
      border: 1.5px solid rgba(180, 220, 255, 0.5);
      box-shadow:
        0 0 30px rgba(80, 150, 255, 0.45),
        inset 0 0 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 0 14px rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 1;
    }

    /* Стеклянный блик сверху */
    .avatar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.25) 0%, transparent 45%);
      border-radius: inherit;
      z-index: 2;
      pointer-events: none;
    }

    /* Мягкое свечение по краю */
    .avatar::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 25px rgba(180, 220, 255, 0.5);
      pointer-events: none;
      z-index: 3;
    }

    /* Орбита — круг сзади авы, вращается */
    .orbit-circle {
      position: absolute;
      top: -14px;
      left: -14px;
      right: -14px;
      bottom: -14px;
      border-radius: 50%;
      border: 2px dashed rgba(120, 180, 255, 0.35);
      animation: rotateOrbit 14s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    /* 4 орбитальные точки по углам авы */
    .orbit-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #e8f2ff;
      border-radius: 50%;
      box-shadow: 0 0 12px #7eb0ff, 0 0 22px rgba(120, 180, 255, 0.8);
      top: 50%; left: 50%;
      transform-origin: 0 0;
      animation: pulse 2s ease-in-out infinite;
    }

    .orbit-dot:nth-child(1) { transform: rotate(45deg)  translate(112px) rotate(-45deg); }
    .orbit-dot:nth-child(2) { transform: rotate(135deg) translate(112px) rotate(-135deg); }
    .orbit-dot:nth-child(3) { transform: rotate(225deg) translate(112px) rotate(-225deg); }
    .orbit-dot:nth-child(4) { transform: rotate(315deg) translate(112px) rotate(-315deg); }

    @keyframes rotateOrbit {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 12px #7eb0ff, 0 0 22px rgba(120,180,255,0.8); }
      50%     { box-shadow: 0 0 18px #b8d4ff, 0 0 34px rgba(160,210,255,0.95); }
    }

    /* Имя: В (синий) П (белый) Н (синий) */
    .name {
      margin-top: 1.4rem;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 3px;
      display: flex;
      gap: 0.15rem;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 12px rgba(80, 150, 255, 0.6);
    }
    .name .blue  { color: #3a8aff; }
    .name .white { color: #f0f4ff; }

    /* Подпись снизу */
    .tagline {
      margin-top: 0.6rem;
      font-size: 1rem;
      color: #a0b5dd;
      background: rgba(20, 30, 50, 0.6);
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(70, 130, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ---------- ВТОРАЯ РАМКА ---------- */
    .subscriptions-card {
      width: 100%;
      max-width: 580px;
      background: rgba(12, 18, 28, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 36px;
      padding: 1.8rem 1.6rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(70, 130, 255, 0.2);
      border: 1px solid rgba(60, 120, 220, 0.25);
    }

    .buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .sub-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 60px;
      padding: 0.5rem 0.5rem 0.5rem 1.1rem;
      border: 1px solid rgba(80, 140, 255, 0.2);
      transition: border-color 0.2s, background 0.2s;
    }
    .sub-row:hover {
      border-color: #3a7eff;
      background: rgba(58, 126, 255, 0.08);
    }

    .sub-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: #d6e3ff;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      min-width: 130px;
    }
    .sub-label svg {
      width: 20px;
      height: 20px;
      stroke: #5f9eff;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      background: transparent;
      border: 1.5px solid #2e5faa;
      color: #b8d0ff;
      padding: 0.45rem 0.9rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .btn:hover {
      background: #2e5faa;
      color: white;
      border-color: #4a8eff;
      box-shadow: 0 0 12px #2a6eff;
      transform: scale(1.03);
    }
    .btn:active { transform: scale(0.96); }

    .btn-copy {
      border-color: #1f8b4c;
      color: #a0e0b0;
    }
    .btn-copy:hover {
      background: #1f8b4c;
      border-color: #2ecc71;
      box-shadow: 0 0 12px #1f8b4c;
      color: white;
    }

    .btn-back {
      border-color: #4a4a6a;
      color: #b0b0d0;
    }
    .btn-back:hover {
      background: #2a2a44;
      border-color: #7a7aaa;
      box-shadow: 0 0 10px #3a3a6a;
      color: white;
    }

    /* Уведомление */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e2b44;
      color: #c0d8ff;
      padding: 12px 28px;
      border-radius: 60px;
      border: 1px solid #3a7eff;
      box-shadow: 0 8px 28px black;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast svg {
      width: 18px;
      height: 18px;
      stroke: #5f9eff;
      stroke-width: 2.5;
      fill: none;
    }

    /* Адаптив */
    @media (max-width: 560px) {
      .sub-row {
        flex-direction: column;
        align-items: stretch;
        padding: 0.9rem;
        border-radius: 24px;
      }
      .sub-label { justify-content: center; }
      .btn-group  { justify-content: center; }
      .btn {

        font-size: 0.7rem;
      }
      .name { font-size: 2rem; }
      .avatar-container { width: 130px; height: 130px; }

      .orbit-dot:nth-child(4) { transform: rotate(315deg) translate(97px) rotate(-315deg); }
    }
  </style>

  <script>
    (function() {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      let toastTimer = null;

      function showToast(message) {
        toastText.textContent = message || 'Ссылка скопирована';
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      // Кнопки "Скопировать"
      document.querySelectorAll('.btn-copy').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const row = this.closest('.sub-row');
          if (!row) return;
          const url = row.dataset.url;
          if (!url) return;

          navigator.clipboard.writeText(url).then(() => {
            showToast('Ссылка скопирована');
          }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = url;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('Ссылка скопирована');
          });
        });
      });

      // Кнопки "Назад"
      document.querySelectorAll('.btn-back').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          showToast('Назад');
        });
      });
    })();
  </script>
