<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN подписки · PIZDUK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0b0e14, #020304);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ---------- ПЕРВАЯ РАМКА (профиль) ---------- */
    .profile-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .avatar-container {
      position: relative;
      width: 140px;
      height: 140px;
    }

    /* Квадратная ава с текстом VPN */
    .avatar {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #141b2b, #0a0f1a);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(56, 130, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #4a8eff;
      text-shadow: 0 0 12px rgba(58, 138, 255, 0.9), 0 0 24px rgba(42, 110, 255, 0.5);
      transition: all 0.2s;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Вращающийся круг с орбитами (по углам) */
    .orbit-circle {
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      border: 2px dashed rgba(80, 140, 255, 0.5);
      animation: rotateOrbit 12s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    /* 4 орбитальные точки (по углам квадрата) */
    .orbit-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #4a8eff;
      border-radius: 50%;
      box-shadow: 0 0 12px #3f7eff, 0 0 20px #2a6eff;
      top: 50%;
      left: 50%;
      transform-origin: 0 0;
    }

    .orbit-dot:nth-child(1) { transform: rotate(45deg) translate(90px) rotate(-45deg); }
    .orbit-dot:nth-child(2) { transform: rotate(135deg) translate(90px) rotate(-135deg); }
    .orbit-dot:nth-child(3) { transform: rotate(225deg) translate(90px) rotate(-225deg); }
    .orbit-dot:nth-child(4) { transform: rotate(315deg) translate(90px) rotate(-315deg); }

    @keyframes rotateOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Имя: В(синий) П(белый) Н(синий) */
    .name {
      margin-top: 1rem;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 120, 255, 0.6);
      display: flex;
      gap: 0.1rem;
      align-items: center;
      justify-content: center;
    }

    .name .blue {
      color: #3a8aff;
    }

    .name .white {
      color: #f0f4ff;
    }

    /* подпись снизу */
    .tagline {
      margin-top: 0.4rem;
      font-size: 1rem;
      color: #a0b5dd;
      font-weight: 400;
      letter-spacing: 0.3px;
      background: rgba(20, 30, 50, 0.6);
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(70, 130, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ---------- ВТОРАЯ РАМКА (кнопки) ---------- */
    .subscriptions-card {
      width: 100%;
      max-width: 560px;
      background: rgba(12, 18, 28, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 36px;
      padding: 2rem 1.8rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(70, 130, 255, 0.2);
      border: 1px solid rgba(60, 120, 220, 0.25);
      transition: box-shadow 0.3s;
    }

    .subscriptions-card:hover {
      box-shadow: 0 30px 50px -12px #0a1a2e, 0 0 0 1px #2a6eff;
    }

    .buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sub-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 60px;
      padding: 0.5rem 0.5rem 0.5rem 1.2rem;
      border: 1px solid rgba(80, 140, 255, 0.2);
      transition: border-color 0.2s, background 0.2s;
    }

    .sub-row:hover {
      border-color: #3a7eff;
      background: rgba(58, 126, 255, 0.08);
    }

    .sub-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: #d6e3ff;
      font-size: 1rem;
      letter-spacing: 0.3px;
      min-width: 140px;
    }

    .sub-label svg {
      width: 20px;
      height: 20px;
      stroke: #5f9eff;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      background: transparent;
      border: 1.5px solid #2e5faa;
      color: #b8d0ff;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .btn:hover {
      background: #2e5faa;
      color: white;
      border-color: #4a8eff;
      box-shadow: 0 0 12px #2a6eff;
      transform: scale(1.02);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-copy {
      border-color: #1f8b4c;
      color: #a0e0b0;
    }

    .btn-copy:hover {
      background: #1f8b4c;
      border-color: #2ecc71;
      box-shadow: 0 0 12px #1f8b4c;
      color: white;
    }

    .btn-back {
      border-color: #4a4a6a;
      color: #b0b0d0;
    }

    .btn-back:hover {
      background: #2a2a44;
      border-color: #7a7aaa;
      box-shadow: 0 0 10px #3a3a6a;
      color: white;
    }

    /* уведомление о копировании */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e2b44;
      color: #c0d8ff;
      padding: 12px 28px;
      border-radius: 60px;
      border: 1px solid #3a7eff;
      box-shadow: 0 8px 28px black;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* адаптив */
    @media (max-width: 520px) {
      .sub-row {
        flex-direction: column;
        align-items: stretch;
        padding: 1rem;
        border-radius: 28px;
      }
      .sub-label {
        justify-content: center;
      }
      .btn-group {
        justify-content: center;
      }
      .btn {
        padding: 0.45rem 0.9rem;
        font-size: 0.75rem;
      }
      .name {
        font-size: 1.8rem;
      }
      .avatar-container {
        width: 120px;
        height: 120px;
      }
      .avatar {
        font-size: 2rem;
        letter-spacing: 2px;
      }
      .orbit-dot:nth-child(1) { transform: rotate(45deg) translate(78px) rotate(-45deg); }
      .orbit-dot:nth-child(2) { transform: rotate(135deg) translate(78px) rotate(-135deg); }
      .orbit-dot:nth-child(3) { transform: rotate(225deg) translate(78px) rotate(-225deg); }
      .orbit-dot:nth-child(4) { transform: rotate(315deg) translate(78px) rotate(-315deg); }
    }
  </style>
</head>

  <!-- уведомление -->
  <div id="toast" class="toast">Ссылка скопирована</div>

  <script>
    (function() {
      const toast = document.getElementById('toast');
      let toastTimer = null;

      function showToast(message) {
        toast.textContent = message || 'Ссылка скопирована';
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 1800);
      }

      // копирование по кнопке .btn-copy
      document.querySelectorAll('.btn-copy').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const row = this.closest('.sub-row');
          if (!row) return;
          const url = row.dataset.url;
          if (!url) return;

          navigator.clipboard.writeText(url).then(() => {
            showToast('✅ Ссылка скопирована');
          }).catch(() => {
            const textarea = document.createElement('textarea');
            textarea.value = url;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('✅ Ссылка скопирована');
          });
        });
      });

      // кнопка "назад"
      document.querySelectorAll('.btn-back').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          showToast('↩️ Назад');
        });
      });
    })();
  </script>
